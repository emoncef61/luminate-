<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Shopping cart icon -->
  <circle cx="30" cy="30" r="28" fill="url(#gradient)" opacity="0.15"/>
  <g transform="translate(14, 13)">
    <!-- Cart body -->
    <path d="M2 2H6L8.5 14H22L24 6H8.5" stroke="url(#gradient)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Cart wheels -->
    <circle cx="11" cy="18" r="1.8" fill="url(#gradient)"/>
    <circle cx="20" cy="18" r="1.8" fill="url(#gradient)"/>
  </g>
  
  <!-- Text: Luminate -->
  <text x="68" y="36" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="url(#textGradient)" letter-spacing="-0.5">Luminate</text>

  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="50%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="50%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
</svg>
